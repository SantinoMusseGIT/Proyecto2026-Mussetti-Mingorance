name: Publicar proyecto en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: segunda-entrega/package-lock.json

      - name: Instalar dependencias
        working-directory: segunda-entrega
        run: npm ci

      - name: Revisar código
        working-directory: segunda-entrega
        run: npm run lint

      - name: Construir aplicación React
        working-directory: segunda-entrega
        run: npm run build

      - name: Preparar ambas entregas
        run: |
          mkdir -p publicacion/primera-entrega
          mkdir -p publicacion/segunda-entrega
          cp -R primera-entrega/. publicacion/
          cp -R primera-entrega/. publicacion/primera-entrega/
          cp -R segunda-entrega/dist/. publicacion/segunda-entrega/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: publicacion

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4